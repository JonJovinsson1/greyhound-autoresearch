[project]
name = "greyhound-autoresearch"
version = "0.1.0"
description = "Autonomous research loop for greyhound race winner prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "catboost>=1.2.7",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Extras the agent can opt into without bloating the base install.
ranking = [
    "lightgbm>=4.3",
    "xgboost>=2.0",
]
deep = [
    "torch>=2.2",     # CPU build is fine on M2
]
